hugoblox:
  schema: "2.0"
  identity:
    name: "Keyan Miao"
    organization: "University of Oxford"
    type: person
    tagline: "DPhil Candidate in Engineering Science"
    description: "Academic website of Keyan Miao, a DPhil candidate at the University of Oxford working on learning-based control, Neural ODEs, safety, stability, and generative models."
    social:
      twitter: ""
  theme:
    mode: system
    pack: "default"
    colors:
      primary: "#365c6f"
      secondary: "#8f5f3f"
      neutral: "zinc"
  typography:
    font: "sans"
    size: "md"
  layout:
    radius: "sm"
    spacing: "comfortable"
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
  footer:
    style: minimal
    language_switcher: false
    text: "Built with HugoBlox Academic CV. Content by Keyan Miao."
  copyright:
    notice: "© {year} {name}."
    license:
      type: custom
      name: "All rights reserved"
      url: ""
  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: ieee
  search:
    enable: true
    suggestions:
      - "Neural ODE"
      - "safe control"
      - "Koopman"
      - "generative models"
  repository:
    enable: true
    url: "https://github.com/KYMiao/KYMiao.github.io"
    branch: main
    content_dir: content
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-gb
  seo:
    title: "Keyan Miao"
    ai:
      allow:
        - /
      disallow: []
      contact: "keyan.miao@eng.ox.ac.uk"
