{{ define "main" }}
<article class="content-wrap article">
  <header class="article-header">
    <p class="eyebrow">{{ .Section }}{{ with .Date }} · {{ .Format "Jan 2, 2006" }}{{ end }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
  </header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
