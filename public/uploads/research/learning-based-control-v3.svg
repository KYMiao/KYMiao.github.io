    <circle cx="592" cy="295" r="12"/><circle cx="592" cy="350" r="12"/><circle cx="592" cy="410" r="12"/><circle cx="592" cy="465" r="12"/>
    <circle cx="680" cy="338" r="12"/><circle cx="680" cy="422" r="12"/>
  </g>
